<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dealers - Impero Kobo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin:0; font-family:'Montserrat',sans-serif; background:#0d0d0d; color:#fff; }
    h2 { color:#e50914; text-align:center; margin:30px 0; }
    .grid { display:flex; flex-wrap:wrap; justify-content:center; gap:20px; padding:30px; }
    .card { background:#1a1a1a; padding:20px; border-radius:8px; width:250px; text-align:center; }
    .card img { width:100%; border-radius:6px; }
    .btn { background:#e50914; color:#fff; padding:8px 12px; border:none; border-radius:4px; cursor:pointer; margin-top:10px; }
    .btn:hover { background:#b00710; }
  </style>
</head>
<body>
  <h2>Our Trusted Dealers</h2>

  <div class="grid">
    <div class="card">
      <img src="images/dealer1.jpeg" alt="Delhi Motors">
      <h3>Delhi Motors</h3>
      <p>Location: New Delhi</p>
      <p>Rating: ★★★★☆</p>
      <button class="btn">View Inventory</button>
    </div>
    <div class="card">
      <img src="images/dealer2.jpeg" alt="Mumbai Auto Hub">
      <h3>Mumbai Auto Hub</h3>
      <p>Location: Mumbai</p>
      <p>Rating: ★★★★★</p>
      <button class="btn">View Inventory</button>
    </div>
    <div class="card">
      <img src="images/dealer3.jpeg" alt="Bangalore Prestige Cars">
      <h3>Bangalore Prestige Cars</h3>
      <p>Location: Bangalore</p>
      <p>Rating: ★★★★☆</p>
      <button class="btn">View Inventory</button>
    </div>
    <div class="card">
      <img src="images/dealer4.jpeg" alt="Hyderabad Elite Wheels">
      <h3>Hyderabad Elite Wheels</h3>
      <p>Location: Hyderabad</p>
      <p>Rating: ★★★★☆</p>
      <button class="btn">View Inventory</button>
    </div>
  </div>
</body>
</html>
