<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Impero Kobo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin:0; font-family:'Montserrat',sans-serif; background:#0d0d0d; color:#fff; }
    .form-box { max-width:400px; margin:80px auto; background:#1a1a1a; padding:30px; border-radius:8px; }
    h2 { color:#e50914; text-align:center; }
    input { width:100%; padding:10px; margin:10px 0; border:none; border-radius:4px; }
    .btn { background:#e50914; color:#fff; padding:12px; border:none; width:100%; cursor:pointer; border-radius:4px; }
    .btn:hover { background:#b00710; }
    .links { text-align:center; margin-top:15px; }
    .links a { color:#e50914; text-decoration:none; }
  </style>
</head>
<body>
  <div class="form-box">
    <h2>Login to Impero Kobo</h2>
    <form>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button class="btn">Login</button>
    </form>
    <div class="links">
      <p><a href="#">Forgot Password?</a></p>
      <p>Don’t have an account? <a href="register.html">Register</a></p>
    </div>
  </div>
</body>
</html>
