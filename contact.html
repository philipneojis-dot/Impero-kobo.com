<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - Impero Kobo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { margin:0; font-family:'Montserrat',sans-serif; background:#0d0d0d; color:#fff; }
    h2 { color:#e50914; text-align:center; margin:30px 0; }
    .form-box { max-width:500px; margin:40px auto; background:#1a1a1a; padding:30px; border-radius:8px; }
    input, textarea { width:100%; padding:10px; margin:10px 0; border:none; border-radius:4px; }
    textarea { resize:none; }
    .btn { background:#e50914; color:#fff; padding:12px; border:none; width:100%; cursor:pointer; border-radius:4px; }
    .btn:hover { background:#b00710; }
    .info { max-width:500px; margin:20px auto; text-align:center; }
    .info p { margin:5px 0; }
  </style>
</head>
<body>
  <h2>Contact Impero Kobo</h2>

  <!-- Contact Form -->
  <div class="form-box">
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email" required>
      <textarea rows="5" placeholder="Your Message" required></textarea>
      <button class="btn">Send Message</button>
    </form>
  </div>

  <!-- Contact Info -->
  <div class="info">
    <p><strong>Address:</strong> Impero Kobo HQ, New Delhi, India</p>
    <p><strong>Email:</strong> support@imperokobo.com</p>
    <p><strong>Phone:</strong> +91-9876543210</p>
    <p>We’re available 24/7 to assist you with buying, selling, or financing your vehicle.</p>
  </div>
</body>
</html>
